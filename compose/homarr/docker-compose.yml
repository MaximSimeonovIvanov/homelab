services:
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    restart: unless-stopped
    volumes:
      - /opt/docker/homarr/configs:/app/data/configs
      - /opt/docker/homarr/icons:/app/public/icons
      # Docker socket allows Homarr to display live container status in the UI
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "7575:7575"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$(hostname -i):7575 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

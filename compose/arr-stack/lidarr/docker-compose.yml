services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Sofia
    ports:
      - "8686:8686"
    volumes:
      - ./config:/config
      # Music library — Lidarr imports completed downloads here.
      # Navidrome reads from the same path (read-only).
      # Update this path when moved to HDD.
      - /mnt/ssd2/music:/music
      # Downloads — must match qBittorrent's downloads volume path exactly.
      # Lidarr monitors this directory for completed downloads to import.
      - /mnt/ssd2/downloads:/downloads
    networks:
      - arrstack

networks:
  arrstack:
    # Shared network with qBittorrent, Prowlarr, and slskd.
    # Lidarr reaches qBittorrent as http://qbittorrent:8090
    # Lidarr reaches Prowlarr as http://prowlarr:9696
    # Create it before first run: docker network create arrstack
    external: true
